# gitleaks configuration.
#
# Extend the built-in rules and allowlist known, non-secret placeholders that
# appear in tests and documentation (fake instance tokens, `curl -H "apikey:
# SUA-CHAVE"` examples, `.env.example` templates). Everything else still uses
# the default rules, so a real leaked credential is still caught.
[extend]
useDefault = true

[allowlist]
description = "Placeholder values in tests, docs and env templates."
paths = [
  '''pkg/jsonx/jsonx_bench_test\.go''',
  # Fuzz payloads: the traversal string "../etc/passwd" sitting next to a fake
  # message-id hex trips the generic-api-key rule. The file contains only
  # adversarial test inputs, no secrets.
  '''pkg/media/safename_fuzz_test\.go''',
  '''docs/wiki/.*\.md$''',
  '''^wiki/.*\.md$''',
  '''(^|/)\.env\.example$''',
]
