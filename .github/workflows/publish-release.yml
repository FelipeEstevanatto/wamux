name: Release (main)

# A push to `main` whose VERSION is not already published builds the versioned
# image (tag = VERSION) and a sha tag, and creates the matching GitHub Release
# as a **pre-release**. A push that leaves VERSION on an already published
# release does not publish again. `latest` and the `<major>.<minor>` tag are
# moved only by the manual "Promote release" workflow. The VERSION file is the
# source of truth; bump it before merging to main.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-prod
  cancel-in-progress: false

jobs:
  release:
    name: Build, push and pre-release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version and refuse an existing tag
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION '$version' is not MAJOR.MINOR.PATCH"
            exit 1
          fi
          if git rev-parse "refs/tags/$version" >/dev/null 2>&1 || gh release view "$version" >/dev/null 2>&1; then
            tagged="$(git show "refs/tags/$version:VERSION" 2>/dev/null | tr -d '[:space:]' || true)"
            if [[ "$tagged" == "$version" ]]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "version=$version" >> "$GITHUB_OUTPUT"
              echo "::notice::VERSION $version is already published; not publishing again."
              exit 0
            fi
            echo "::error::tag $version already exists; bump VERSION before merging"
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        if: steps.version.outputs.skip != 'true'
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/felipeestevanatto/wamux
          # Only immutable tags here. Floating `latest`/minor tags are promotion.
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha
          labels: |
            org.opencontainers.image.title=WaMux (community fork)
            org.opencontainers.image.description=Unofficial community build of WaMux. Not affiliated with, endorsed by, or an official release of Evolution Foundation.
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.vendor=FelipeEstevanatto (community fork, not Evolution Foundation)

      - name: Set up Docker Buildx
        if: steps.version.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: steps.version.outputs.skip != 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: docker_build
        if: steps.version.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}

      - name: Create pre-release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          NOTES=".github/release-notes/${VERSION}.md"
          TITLE="${VERSION} — WaMux"
          if [ -f "$NOTES" ]; then
            gh release create "$VERSION" --target "$GITHUB_SHA" --title "$TITLE" --notes-file "$NOTES" --prerelease
          else
            gh release create "$VERSION" --target "$GITHUB_SHA" --title "$TITLE" --generate-notes --prerelease
          fi

      - name: Image digest
        if: steps.version.outputs.skip != 'true'
        run: echo "${{ steps.docker_build.outputs.digest }}"
