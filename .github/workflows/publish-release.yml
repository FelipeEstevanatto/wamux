name: Release (main)

# A push to `main` publishes the versioned image (tag = VERSION) plus `latest`,
# and creates the matching GitHub Release. The VERSION file is the source of
# truth; bump it before merging to main.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build, push and release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/felipeestevanatto/evo-gofork
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Evolution Go (community fork)
            org.opencontainers.image.description=Unofficial community build of Evolution Go. Not affiliated with, endorsed by, or an official release of Evolution Foundation.
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.vendor=FelipeEstevanatto (community fork, not Evolution Foundation)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists — leaving it untouched."
            exit 0
          fi
          NOTES=".github/release-notes/${VERSION}.md"
          TITLE="${VERSION} — Evo-GoFork (fork comunitário do Evolution Go)"
          if [ -f "$NOTES" ]; then
            gh release create "$VERSION" --target "$GITHUB_SHA" --title "$TITLE" --notes-file "$NOTES"
          else
            gh release create "$VERSION" --target "$GITHUB_SHA" --title "$TITLE" --generate-notes
          fi

      - name: Image digest
        run: echo "${{ steps.docker_build.outputs.digest }}"
