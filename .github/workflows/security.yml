name: Security

# Dependency and code scanning that must pass before a release. Runs on every
# push and PR so a vulnerable dependency or a leaked credential is caught at the
# point it is introduced, not at deploy time.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Weekly, so a newly disclosed CVE in an unchanged dependency is still caught.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck (Go vulnerabilities)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # govulncheck reports only vulnerabilities that are actually reachable from
      # the code, which keeps the signal high and the noise low.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  vet-and-race:
    name: vet + race tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race ./...

  fuzz-parsers:
    name: fuzz parsers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Drive each fuzz target past its seed corpus for a bounded time so a
      # regression in a parser (JID, URL, HMAC, ciphertext, media id, message
      # summary) surfaces on the PR that introduces it. The seed corpus also
      # runs as part of `go test`, so this is the deeper sweep.
      - name: fuzz
        run: make fuzz FUZZTIME=30s

  manager-tests:
    name: manager tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        working-directory: wamux-manager
        run: bun install --frozen-lockfile

      - name: Test
        working-directory: wamux-manager
        run: bun run test

  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Fails the build if a credential-shaped string (API key, token, private
      # key) is committed. The instance tokens are encrypted at rest in the DB,
      # but a leaked .env or test fixture would still be caught here.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
