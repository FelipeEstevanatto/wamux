name: Security

# Dependency and code scanning that must pass before a release. Runs on every
# push and PR so a vulnerable dependency or a leaked credential is caught at the
# point it is introduced, not at deploy time.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Weekly, so a newly disclosed CVE in an unchanged dependency is still caught.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck (Go vulnerabilities)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # govulncheck reports only vulnerabilities that are actually reachable from
      # the code, which keeps the signal high and the noise low.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  vet-and-race:
    name: vet + race tests
    runs-on: ubuntu-24.04
    # Real services: the tenant isolation, deadlock, ListChats and delivery tests skip
    # without them, and a skipped test passes silently.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wamux
          POSTGRES_PASSWORD: wamux
          POSTGRES_DB: wamux_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wamux"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:3-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
      nats:
        image: nats:2-alpine
        ports:
          - 4222:4222
    env:
      EVO_BENCH_POSTGRES_DSN: postgresql://wamux:wamux@127.0.0.1:5432/wamux_test?sslmode=disable
      WAMUX_TEST_AMQP_URL: amqp://guest:guest@127.0.0.1:5672/
      WAMUX_TEST_NATS_URL: nats://127.0.0.1:4222
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race ./...

  fuzz-parsers:
    name: fuzz parsers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Drive each fuzz target past its seed corpus for a bounded time so a
      # regression in a parser (JID, URL, HMAC, ciphertext, media id, message
      # summary) surfaces on the PR that introduces it. The seed corpus also
      # runs as part of `go test`, so this is the deeper sweep.
      - name: fuzz
        run: make fuzz FUZZTIME=30s

  manager-tests:
    name: manager tests (vitest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        working-directory: wamux-manager
        run: bun install --frozen-lockfile

      - name: Test
        working-directory: wamux-manager
        run: bun run test

  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Fails the build if a credential-shaped string (API key, token, private
      # key) is committed. The instance tokens are encrypted at rest in the DB,
      # but a leaked .env or test fixture would still be caught here.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
