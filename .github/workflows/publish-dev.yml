name: Dev image (develop)

# Every push to `develop` refreshes a single moving `dev` tag. No version churn:
# the release tags/Releases are produced by the `main` workflow only.
on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  dev:
    name: Build and push :dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/felipeestevanatto/evo-gofork:dev
          labels: |
            org.opencontainers.image.title=Evolution Go (community fork) — dev
            org.opencontainers.image.description=Unofficial community build of Evolution Go (development channel). Not affiliated with, endorsed by, or an official release of Evolution Foundation.
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.vendor=FelipeEstevanatto (community fork, not Evolution Foundation)
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}-dev
