# =============================================================================
# WaMux — Docker Swarm behind Traefik, with a Postgres you provide.
#
#   docker network create --driver overlay network_public
#   export WAMUX_DOMAIN=wamux.example.com
#   export POSTGRES_URL=postgresql://user:pass@host:5432
#   docker stack deploy -c docker-compose.swarm.yml wamux
#
# The API key is generated on first boot, in the wamux_data volume. Read it with
# `cat /app/data/global-api-key` inside the container, or set GLOBAL_API_KEY. The app
# stays on one node, because a WhatsApp session can only run in one place.
#
# Traefik on the overlay network is trusted for client IPs by default.
# =============================================================================

services:
  wamux:
    image: ghcr.io/felipeestevanatto/wamux:${WAMUX_VERSION:-latest}
    networks:
      - network_public
    environment:
      SERVER_PORT: 8080
      # Names this server. Instances belong to the name they were created under, so
      # changing it hides them until it is changed back. Nothing is deleted. Servers
      # sharing a database need different names.
      CLIENT_NAME: ${CLIENT_NAME:-wamux}
      GLOBAL_API_KEY: ${GLOBAL_API_KEY:-}
      POSTGRES_AUTH_DB: ${POSTGRES_URL:?set POSTGRES_URL}/wamux_auth?sslmode=${POSTGRES_SSLMODE:-disable}
      POSTGRES_USERS_DB: ${POSTGRES_URL:?set POSTGRES_URL}/wamux_users?sslmode=${POSTGRES_SSLMODE:-disable}
    volumes:
      - wamux_data:/app/data
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s
      labels:
        - traefik.enable=true
        - traefik.http.routers.wamux.rule=Host(`${WAMUX_DOMAIN:?set WAMUX_DOMAIN}`)
        - traefik.http.routers.wamux.entrypoints=websecure
        - traefik.http.routers.wamux.tls.certresolver=letsencryptresolver
        - traefik.http.routers.wamux.service=wamux
        - traefik.http.services.wamux.loadbalancer.server.port=8080
        - traefik.http.services.wamux.loadbalancer.passHostHeader=true

volumes:
  wamux_data:

networks:
  network_public:
    external: true
    name: network_public
