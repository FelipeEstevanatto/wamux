# =============================================================================
# WaMux (community fork) — full stack
#
# App + Postgres + RabbitMQ + MinIO + NATS, all wired together. Use this as a
# starting point for production; trim the services you do not need.
#
#   docker compose -f docker-compose.full.yml up -d
#
# Then open http://localhost:4000/manager (set GLOBAL_API_KEY below first).
# =============================================================================

services:
  wamux:
    image: ghcr.io/felipeestevanatto/wamux:${WAMUX_VERSION:-dev}
    restart: unless-stopped
    init: true
    ports:
      - "4000:4000"
    environment:
      SERVER_PORT: 4000
      CLIENT_NAME: wamux
      OS_NAME: WaMux

      # REQUIRED: change this.
      GLOBAL_API_KEY: change-me-to-a-long-random-key

      POSTGRES_AUTH_DB: postgresql://wamux_user:wamux_pass@wamux-database:5432/wamux_auth?sslmode=disable
      POSTGRES_USERS_DB: postgresql://wamux_user:wamux_pass@wamux-database:5432/wamux_users?sslmode=disable
      DATABASE_SAVE_MESSAGES: "true"
      MESSAGE_RETENTION_DAYS: "365"

      CONNECT_ON_STARTUP: "true"
      WEBHOOK_FILES: "true"
      LOG_DIRECTORY: /app/data/logs
      DEBUG_ENABLED: "0"
      LOG_TYPE: console
      SWAGGER_ENABLED: "true"

      # Webhook
      WEBHOOK_URL: "https://your-webhook.example.com/endpoint"

      # RabbitMQ (server accepts AMQP_URL; the credentials live in the broker)
      AMQP_URL: "amqp://admin:admin@wamux-rabbitmq:5672/default"
      AMQP_GLOBAL_ENABLED: "true"
      # Event groups published globally: MESSAGE, SEND_MESSAGE, READ_RECEIPT,
      # PRESENCE, HISTORY_SYNC, CHAT_PRESENCE, CALL, CONNECTION, LABEL, CONTACT,
      # GROUP, NEWSLETTER, QRCODE. Empty means no global queues are created.
      AMQP_GLOBAL_EVENTS: "MESSAGE,CONNECTION"
      AMQP_SPECIFIC_EVENTS: ""

      # NATS
      NATS_URL: "nats://wamux-nats:4222"
      NATS_GLOBAL_ENABLED: "false"
      NATS_GLOBAL_EVENTS: ""

      # MinIO media storage
      MINIO_ENABLED: "true"
      MINIO_ENDPOINT: "wamux-minio:9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin"
      MINIO_BUCKET: "wamux-media"
      MINIO_USE_SSL: "false"
      MINIO_REGION: "us-east-1"

    volumes:
      - wamux_data:/app/data
    depends_on:
      wamux-database:
        condition: service_healthy
      wamux-rabbitmq:
        condition: service_healthy
    networks:
      - wamux_network

  wamux-database:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wamux_user
      POSTGRES_PASSWORD: wamux_pass
      POSTGRES_DB: wamux_auth
    volumes:
      # PostgreSQL 18 volume path (not /var/lib/postgresql/data).
      - wamux_database:/var/lib/postgresql
    networks:
      - wamux_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wamux_user -d wamux_auth"]
      interval: 10s
      timeout: 5s
      retries: 10

  wamux-rabbitmq:
    # 3.13 is end-of-life; 4.x is the current supported line.
    image: rabbitmq:4.3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
      RABBITMQ_DEFAULT_VHOST: default
    ports:
      - "15672:15672"   # management UI (http://localhost:15672)
    volumes:
      - wamux_rabbitmq_data:/var/lib/rabbitmq
    networks:
      - wamux_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10

  wamux-nats:
    image: nats:2.15-alpine
    restart: unless-stopped
    command: ["-js", "-m", "8222"]
    ports:
      - "8222:8222"     # monitoring (http://localhost:8222)
    volumes:
      - wamux_nats_data:/data
    networks:
      - wamux_network

  wamux-minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"     # console (http://localhost:9001)
    volumes:
      - wamux_minio_data:/data
    networks:
      - wamux_network

volumes:
  wamux_data:
  wamux_database:
  wamux_rabbitmq_data:
  wamux_nats_data:
  wamux_minio_data:

networks:
  wamux_network:
    driver: bridge
