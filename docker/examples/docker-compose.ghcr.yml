# =============================================================================
# WaMux (community fork) — pull-only stack
#
# Runs the published image from GHCR. Nothing to clone or build.
#
#   mkdir wamux && cd wamux
#   curl -O https://raw.githubusercontent.com/FelipeEstevanatto/wamux/develop/docker/examples/docker-compose.ghcr.yml
#   mv docker-compose.ghcr.yml docker-compose.yml
#   curl -O https://raw.githubusercontent.com/FelipeEstevanatto/wamux/develop/docker/examples/.env.example
#   cp .env.example .env        # then set GLOBAL_API_KEY
#   docker compose up -d
#
# API:      http://localhost:8081
# Swagger:  http://localhost:8081/swagger/index.html
# Manager:  http://localhost:8081/manager
#
# Tags: `dev` = develop branch (newest), `0.8.1` = current release, `latest`
# follows releases. Override with WAMUX_VERSION in .env.
#
# This is an UNOFFICIAL community build. See NOTICE/TRADEMARKS.md.
# =============================================================================

services:
  wamux:
    image: ghcr.io/felipeestevanatto/wamux:${WAMUX_VERSION:-dev}
    restart: unless-stopped
    init: true
    ports:
      # Host port : container port. The app always listens on 8080 inside.
      - "${WAMUX_PORT:-8081}:8080"
    environment:
      SERVER_PORT: 8080
      CLIENT_NAME: ${CLIENT_NAME:-wamux}
      OS_NAME: ${OS_NAME:-WaMux}

      # REQUIRED. Admin key for /instance/all, /server/stats, the Manager, etc.
      GLOBAL_API_KEY: ${GLOBAL_API_KEY:?set GLOBAL_API_KEY in .env}

      # Databases (created automatically on first boot if missing).
      POSTGRES_AUTH_DB: postgresql://${POSTGRES_USER:-wamux_user}:${POSTGRES_PASSWORD:-wamux_pass}@wamux-database:5432/wamux_auth?sslmode=disable
      POSTGRES_USERS_DB: postgresql://${POSTGRES_USER:-wamux_user}:${POSTGRES_PASSWORD:-wamux_pass}@wamux-database:5432/wamux_users?sslmode=disable

      # Runtime / logging.
      DATABASE_SAVE_MESSAGES: ${DATABASE_SAVE_MESSAGES:-true}
      MESSAGE_RETENTION_DAYS: ${MESSAGE_RETENTION_DAYS:-365}
      DASHBOARD_CACHE_TTL_SECONDS: ${DASHBOARD_CACHE_TTL_SECONDS:-30}
      CONNECT_ON_STARTUP: ${CONNECT_ON_STARTUP:-true}
      WEBHOOK_FILES: ${WEBHOOK_FILES:-true}
      DEBUG_ENABLED: ${DEBUG_ENABLED:-0}
      LOG_TYPE: ${LOG_TYPE:-console}
      LOG_DIRECTORY: /app/data/logs
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}

      # Optional integrations (leave empty to disable).
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_HMAC_KEY: ${WEBHOOK_HMAC_KEY:-}
      WEBHOOK_HMAC_ENCRYPTION_KEY: ${WEBHOOK_HMAC_ENCRYPTION_KEY:-}
      WEBHOOK_ERROR_QUEUE_NAME: ${WEBHOOK_ERROR_QUEUE_NAME:-webhook_errors}
      SSRF_PROTECTION: ${SSRF_PROTECTION:-false}
      PASSKEY_PUBLIC_URL: ${PASSKEY_PUBLIC_URL:-}
      AMQP_URL: ${AMQP_URL:-}
      AMQP_GLOBAL_ENABLED: ${AMQP_GLOBAL_ENABLED:-false}
      AMQP_GLOBAL_EVENTS: ${AMQP_GLOBAL_EVENTS:-}
      AMQP_SPECIFIC_EVENTS: ${AMQP_SPECIFIC_EVENTS:-}
      NATS_URL: ${NATS_URL:-}
      NATS_GLOBAL_ENABLED: ${NATS_GLOBAL_ENABLED:-false}
      NATS_GLOBAL_EVENTS: ${NATS_GLOBAL_EVENTS:-}
      MINIO_ENABLED: ${MINIO_ENABLED:-false}
    depends_on:
      wamux-database:
        condition: service_healthy
    volumes:
      # Single data volume: logs live under /app/data/logs.
      - wamux_data:/app/data
    networks:
      - wamux_network

  wamux-database:
    # PostgreSQL 18. NOTE: the 18 image declares /var/lib/postgresql as the data
    # volume (15 used /var/lib/postgresql/data). Mounting the old path would put
    # the cluster OUTSIDE the volume and lose data on the next recreate.
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wamux_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wamux_pass}
      POSTGRES_DB: wamux_auth
    volumes:
      - wamux_database:/var/lib/postgresql
    networks:
      - wamux_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wamux_user} -d wamux_auth"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  wamux_data:
  wamux_database:

networks:
  wamux_network:
    driver: bridge
