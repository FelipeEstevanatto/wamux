# =============================================================================
# WaMux (community fork) — minimal pull-only stack
#
# Same as docker-compose.ghcr.yml but with everything on one hard-coded
# container port (4000) and no .env indirection, for a quick local run:
#
#   docker compose -f docker-compose.yml up -d
#
# Then set GLOBAL_API_KEY below and open http://localhost:4000/manager
# =============================================================================

services:
  wamux:
    image: ghcr.io/felipeestevanatto/wamux:${WAMUX_VERSION:-dev}
    restart: unless-stopped
    init: true
    ports:
      - "4000:4000"
    environment:
      SERVER_PORT: 4000
      CLIENT_NAME: wamux
      OS_NAME: WaMux

      # REQUIRED: change this.
      GLOBAL_API_KEY: change-me-to-a-long-random-key

      POSTGRES_AUTH_DB: postgresql://wamux_user:wamux_pass@wamux-database:5432/wamux_auth?sslmode=disable
      POSTGRES_USERS_DB: postgresql://wamux_user:wamux_pass@wamux-database:5432/wamux_users?sslmode=disable
      DATABASE_SAVE_MESSAGES: "true"

      CONNECT_ON_STARTUP: "true"
      WEBHOOK_FILES: "true"
      LOG_DIRECTORY: /app/data/logs
      DEBUG_ENABLED: "0"
      LOG_TYPE: console
      SWAGGER_ENABLED: "true"

    volumes:
      - wamux_data:/app/data
    depends_on:
      wamux-database:
        condition: service_healthy
    networks:
      - wamux_network

  wamux-database:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wamux_user
      POSTGRES_PASSWORD: wamux_pass
      POSTGRES_DB: wamux_auth
    volumes:
      # PostgreSQL 18 volume path (not /var/lib/postgresql/data).
      - wamux_database:/var/lib/postgresql
    networks:
      - wamux_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wamux_user -d wamux_auth"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  wamux_data:
  wamux_database:

networks:
  wamux_network:
    driver: bridge
