# =============================================================================
# WaMux — the default stack: the app and Postgres, with nothing to configure.
#
#   docker compose up -d
#   docker compose exec wamux cat /app/data/global-api-key
#
# That key logs in to http://localhost:8081/manager. It is generated on first boot
# and kept in the wamux_data volume. To choose your own, set GLOBAL_API_KEY.
#
# Every setting is optional and goes in a .env file next to this one; see
# .env.example. Common ones: CLIENT_NAME, WAMUX_PORT, WAMUX_VERSION (`latest`, `1.0.0`
# or `dev`) and POSTGRES_PASSWORD, which must be set before the first boot.
#
# Behind a reverse proxy on this host, this network or your LAN, client IPs already
# work. For a proxy on a public address, set TRUSTED_PROXIES.
#
# Needs Docker Compose 2.24 or newer. An unofficial community build: see NOTICE.
# =============================================================================

services:
  wamux:
    image: ghcr.io/felipeestevanatto/wamux:${WAMUX_VERSION:-latest}
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    ports:
      - "${WAMUX_PORT:-8081}:8080"
    environment:
      SERVER_PORT: 8080
      # Names this server. Instances belong to the name they were created under, so
      # changing it hides them until it is changed back. Nothing is deleted. Servers
      # sharing a database need different names.
      CLIENT_NAME: ${CLIENT_NAME:-wamux}
      POSTGRES_AUTH_DB: postgresql://${POSTGRES_USER:-wamux_user}:${POSTGRES_PASSWORD:-wamux_pass}@wamux-database:5432/wamux_auth?sslmode=disable
      POSTGRES_USERS_DB: postgresql://${POSTGRES_USER:-wamux_user}:${POSTGRES_PASSWORD:-wamux_pass}@wamux-database:5432/wamux_users?sslmode=disable
    volumes:
      - wamux_data:/app/data
    depends_on:
      wamux-database:
        condition: service_healthy

  # Only the app can reach it: no port is published.
  wamux-database:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wamux_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wamux_pass}
      POSTGRES_DB: wamux_auth
    volumes:
      # The path for PostgreSQL 18. /var/lib/postgresql/data would lose data.
      - wamux_database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wamux_user} -d wamux_auth"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  wamux_data:
  wamux_database:
