# =============================================================================
# Evolution Go (community fork) — minimal pull-only stack
#
# Same as docker-compose.ghcr.yml but with everything on one hard-coded
# container port (4000) and no .env indirection, for a quick local run:
#
#   docker compose -f docker-compose.yml up -d
#
# Then set GLOBAL_API_KEY below and open http://localhost:4000/manager
# =============================================================================

services:
  evolution-go:
    image: ghcr.io/felipeestevanatto/evo-gofork:${EVOGO_VERSION:-dev}
    restart: unless-stopped
    init: true
    ports:
      - "4000:4000"
    environment:
      SERVER_PORT: 4000
      CLIENT_NAME: evolution
      OS_NAME: Evo-GoFork

      # REQUIRED: change this.
      GLOBAL_API_KEY: change-me-to-a-long-random-key

      POSTGRES_AUTH_DB: postgresql://evolution_user:evolution_pass@evolution-database:5432/evogo_auth?sslmode=disable
      POSTGRES_USERS_DB: postgresql://evolution_user:evolution_pass@evolution-database:5432/evogo_users?sslmode=disable
      DATABASE_SAVE_MESSAGES: "true"

      CONNECT_ON_STARTUP: "true"
      WEBHOOK_FILES: "true"
      LOG_DIRECTORY: /app/data/logs
      DEBUG_ENABLED: "0"
      LOG_TYPE: console
      SWAGGER_ENABLED: "true"

    volumes:
      - evolution_go_data:/app/data
    depends_on:
      evolution-database:
        condition: service_healthy
    networks:
      - evolution_go_network

  evolution-database:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution_user
      POSTGRES_PASSWORD: evolution_pass
      POSTGRES_DB: evogo_auth
    volumes:
      # PostgreSQL 18 volume path (not /var/lib/postgresql/data).
      - evolution_go_database:/var/lib/postgresql
    networks:
      - evolution_go_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution_user -d evogo_auth"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  evolution_go_data:
  evolution_go_database:

networks:
  evolution_go_network:
    driver: bridge
